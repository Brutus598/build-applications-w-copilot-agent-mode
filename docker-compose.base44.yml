services:
  mongo:
    image: mongo:7
    restart: on-failure
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.runCommand({ping:1}).ok"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  backend:
    image: node:22
    restart: on-failure
    working_dir: /app
    volumes:
      - ./octofit-tracker/backend:/app
    environment:
      - MONGODB_URI=mongodb://mongo:27017/octofit_db
      - PORT=8000
    command: ["sh", "-ec", "npm install && exec npx tsx watch src/index.ts"]
    ports:
      - "8000:8000"
    depends_on:
      mongo:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:8000/api/health').then(r=>{process.exit(r.ok?0:1)}).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 25s

  frontend:
    image: node:22
    restart: on-failure
    working_dir: /app
    volumes:
      - ./octofit-tracker/frontend:/app
    environment:
      - VITE_API_URL=http://backend:8000
      - __VITE_ADDITIONAL_SERVER_ALLOWED_HOSTS
    command: ["sh", "-ec", "npm install && exec npx vite --host 0.0.0.0 --port 5173"]
    ports:
      - "3000:5173"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:5173/').then(r=>{process.exit(r.ok?0:1)}).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  seed:
    profiles: ["tools"]
    image: node:22
    working_dir: /app
    volumes:
      - ./octofit-tracker/backend:/app
    environment:
      - MONGODB_URI=mongodb://mongo:27017/octofit_db
    command: ["sh", "-ec", "exec npx tsx src/scripts/seed.ts"]
    depends_on:
      backend:
        condition: service_healthy

volumes:
  mongo_data:
